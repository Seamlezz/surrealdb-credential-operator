name: publish-edge

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-edge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/devenv
      - run: devenv shell -- check

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/devenv
      - run: devenv shell -- test-e2e

  publish:
    needs: [check, e2e]
    runs-on: ubuntu-latest
    env:
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/devenv
      - name: Compute tags
        id: tags
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "chart_version=0.0.0-edge.${short_sha}" >> "$GITHUB_OUTPUT"
      - run: devenv shell -- ghcr-login
      - name: Publish edge and sha images
        run: devenv shell -- publish-image edge "sha-${{ steps.tags.outputs.short_sha }}"
      - name: Publish edge chart
        run: devenv shell -- publish-chart "${{ steps.tags.outputs.chart_version }}"
